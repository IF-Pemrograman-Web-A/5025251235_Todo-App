<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>You're Offline</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .offline-container {
            padding: 30px;
        }

        h1 {
            font-size: 2rem;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <h1>You're Offline!</h1>
        <p>Oops! Your internet connection is unavailable.</p>
        <p>Please reconnect to access your Todo List.</p>
    </div>
</body>
</html>
